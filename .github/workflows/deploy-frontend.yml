# ============================================================================
# Workflow: CI del Frontend (QA)
# ----------------------------------------------------------------------------
# Se dispara SOLO cuando cambian archivos del frontend ('frontend/**') o el
# propio workflow. Ejecuta control de calidad y pruebas. El despliegue lo hace
# Vercel por su propia integración con GitHub (no depende de este workflow).
# ============================================================================

name: QA Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

# Cancelar ejecuciones anteriores de la misma rama/PR si llega un commit nuevo:
# evita gastar minutos de GitHub Actions y desplegar builds obsoletos.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # -------------------------------------------------------------------------
  # quality-and-tests — Control de calidad y pruebas.
  # -------------------------------------------------------------------------
  quality-and-tests:
    name: Calidad y Pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        # Todas las tareas de este job trabajan dentro del frontend.
        working-directory: frontend
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 con caché de dependencias
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (instalación limpia y reproducible)
        run: npm ci

      - name: Linter y formato (detiene el pipeline si falla)
        run: npm run lint

      - name: Verificación de tipos (TypeScript)
        run: npx tsc -b

      - name: Pruebas unitarias / integración
        # `--if-present`: si aún no existe un script "test", no falla; cuando se
        # agregue la suite, correrá automáticamente aquí.
        run: npm run test --if-present