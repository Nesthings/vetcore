[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "app.api.deps.require_clinic_roles",
    "app.api.deps.require_roles",
    "app.api.deps.require_component",
]

[tool.ruff.format]
quote-style = "double"
