[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Strings HTML/adjuntos en línea son intencionalmente largos.
"app/services/email_templates.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "app.api.deps.require_clinic_roles",
    "app.api.deps.require_roles",
    "app.api.deps.require_component",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
