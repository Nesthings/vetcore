version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: vetcore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vetcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vetcore_dev}
      POSTGRES_DB: ${POSTGRES_DB:-vetcore}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - vetcore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vetcore} -d ${POSTGRES_DB:-vetcore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: vetcore-backend
    restart: unless-stopped
    environment:
      ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vetcore}:${POSTGRES_PASSWORD:-vetcore_dev}@db:5432/${POSTGRES_DB:-vetcore}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio en producción}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD es obligatorio en producción}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SMART_ALERTS_SWEEP_ENABLED: "true"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "10"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: vetcore-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vetcore_pgdata: